services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://wascat:wascat@postgres:5432/wascat?schema=public
    depends_on: [postgres]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wascat
      POSTGRES_PASSWORD: wascat
      POSTGRES_DB: wascat
    volumes: ["wascat-db:/var/lib/postgresql/data"]
volumes:
  wascat-db:
